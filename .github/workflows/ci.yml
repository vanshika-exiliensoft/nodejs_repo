name: Node.js CI Pipeline

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

jobs:
  nodejs-ci:
    name: Run Centralized Node.js Pipeline

    uses: vanshika-exiliensoft/Multilanguage-pipeline/.github/workflows/centralized-pipeline.yml@develop

    with:
      language: auto
      app_directory: .
      node_version: "22"
      python_version: "3.12"
      java_version: "17"
      php_version: "8.3"
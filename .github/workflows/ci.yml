
name: Node.js CI Pipeline

on:
  push:
    branches:
      - develop
      - feat-docker-multicloud-deployment

  pull_request:
    branches:
      - develop

permissions:
  contents: write
  issues: write
  pull-requests: write
  security-events: write
  id-token: write

jobs:
  nodejs-ci:
    name: Run Centralized Multi-Language Pipeline

    uses: vanshika-exiliensoft/Multilanguage-pipeline/.github/workflows/centralized-pipeline.yml@feat-gcp/aws-terraform

    with:
      language: auto
      app_directory: .
      version: "24"
      deploy_to_aws: true

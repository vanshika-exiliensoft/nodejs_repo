
name: Node.js CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - '**'

  pull_request:
    branches:
      - '**'

permissions:
  contents: write
  issues: write
  pull-requests: write
  security-events: write

jobs:
  centralized-pipeline:
    name: Run Centralized Pipeline

    uses: vanshika-exiliensoft/Multilanguage-pipeline/.github/workflows/centralized-pipeline.yml@develop

    permissions:
      contents: write
      issues: write
      pull-requests: write
      security-events: write

    with:
      language: nodejs
      app_directory: "."
      version: "24"
